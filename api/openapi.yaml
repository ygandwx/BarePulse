  "components": {
    "securitySchemes": {
      "SessionCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "bp_session",
        "description": "HttpOnly SameSite Strict session cookie; Secure is configured for HTTPS deployment. Default TTL 8 hours."
      },
      "CSRF": {
        "type": "apiKey",
        "in": "header",
        "name": "X-CSRF-Token",
        "description": "Current cookie-session CSRF token from login/me, required on every unsafe cookie-authenticated operation. If Origin is present it must equal BASE_URL."
      },
      "ConsoleToken": {
        "type": "apiKey",
        "in": "header",
        "name": "X-Console-Token",
        "description": "Redeemed one-use console ticket yields 300-second access scoped to actor, session, binding and generation; checked continuously for SSE."
      },
      "PortalToken": {
        "type": "apiKey",
        "in": "header",
        "name": "X-Portal-Token",
        "description": "15-minute portal grant scoped to integration/service/customer/server/session. Suspension, termination, disabled integration or ownership change revokes access; no browser long-term integration secret."
      },
      "IntegrationInstance": {
        "type": "apiKey",
        "in": "header",
        "name": "X-BarePulse-Instance"
      },
      "IntegrationTimestamp": {
        "type": "apiKey",
        "in": "header",
        "name": "X-BarePulse-Timestamp",
        "description": "Unix seconds within ±60 seconds of server time."
      },
      "IntegrationNonce": {
        "type": "apiKey",
        "in": "header",
        "name": "X-BarePulse-Nonce",
        "description": "Fresh random nonce 24–128 characters. Nonces cannot be replayed; PHP client sends 48 hex characters."
      },
      "IntegrationSignature": {
        "type": "apiKey",
        "in": "header",
        "name": "X-BarePulse-Signature",
        "description": "Hex HMAC-SHA256(secret, METHOD + '\\n' + requestURI including exact query + '\\n' + timestamp + '\\n' + nonce + '\\n' + hex SHA256(raw body)). GET signs empty body. A new nonce/signature per retry; same power idempotency key. Signatures and secrets remain server-side."
      }
    },
    "schemas": {
      "ID": {
        "type": "string",
        "pattern": "^[0-9a-f]{48}$",
        "description": "Platform IDs and bearer credentials are 24 random bytes encoded as 48 lowercase hex characters."
      },
      "WHMCSID": {
        "type": "string",
        "pattern": "^[1-9][0-9]{0,17}$",
        "description": "WHMCS numeric IDs are strings, never JSON numbers."
      },
      "DecimalBytes": {
        "type": "string",
        "pattern": "^(0|[1-9][0-9]{0,29})$",
        "description": "Exact nonnegative integer bytes encoded as a decimal string. Counter input is additionally limited to uint64."
      },
      "Error": {
        "type": "object",
        "properties": {
          "error": {
            "type": "object",
            "properties": {
              "code": {
                "type": "string"
              },
              "message": {
                "type": "string"
              }
            },
            "required": [
              "code",
              "message"
            ],
            "additionalProperties": false
          },
          "request_id": {
            "$ref": "#/components/schemas/ID"
          }
        },
        "required": [
          "error",
          "request_id"
        ],
        "additionalProperties": false
      },
      "User": {
        "type": "object",
        "properties": {
          "id": {
            "$ref": "#/components/schemas/ID"
          },
          "email": {
            "type": "string",
            "format": "email"
          },
          "role": {
            "type": "string",
            "enum": [
              "admin",
              "customer",
              "operator"
            ]
          }
        },
        "required": [
          "id",
          "email",
          "role"
        ],
        "additionalProperties": false,
        "x-go-type": "app.User"
      },
      "Session": {
        "type": "object",
        "properties": {
          "user": {
            "$ref": "#/components/schemas/User"
          },
          "csrf": {
            "$ref": "#/components/schemas/ID"
          }
        },
        "required": [
          "user",
          "csrf"
        ],
        "additionalProperties": false
      },
      "Login": {
        "type": "object",
        "properties": {
          "email": {
            "type": "string"
          },
          "password": {
            "type": "string"
          }
        },
        "required": [
          "email",
          "password"
        ],
        "additionalProperties": false
      },
      "Server": {
        "type": "object",
        "properties": {
          "id": {
            "$ref": "#/components/schemas/ID"
          },
          "name": {
            "type": "string"
          },
          "owner_id": {
            "$ref": "#/components/schemas/ID"
          },
          "model": {
            "type": "string"
          },
          "notes": {
            "type": "string"
          },
          "maintenance": {
            "type": "boolean"
          },
          "version": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "updated_at": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "id",
          "name",
          "owner_id",
          "model",
          "notes",
          "maintenance",
          "version",
          "created_at",
          "updated_at"
        ],
        "additionalProperties": false,
        "x-go-type": "app.Server"
      },
      "ServerInput": {
        "type": "object",
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "owner_id": {
            "$ref": "#/components/schemas/ID"
          },
          "model": {
            "type": "string",
            "maxLength": 500
          },
          "notes": {
            "type": "string",
            "maxLength": 8000
          },
          "maintenance": {
            "type": "boolean"
          },
          "version": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          }
        },
        "required": [
          "name",
          "owner_id"
        ],
        "additionalProperties": false
      },
      "DeviceKind": {
        "type": "string",
        "enum": [
          "mock_pikvm",
          "mock_pdu",
          "mock_bmc",
          "pikvm",
          "apc",
          "redfish",
          "ipmi",
          "snmp"
        ]
      },
      "Scenario": {
        "type": "string",
        "enum": [
