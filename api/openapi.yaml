  "paths": {
    "/api/v1/integrations/{id}": {
      "put": {
        "tags": [
          "WHMCS"
        ],
        "summary": "Update integration metadata, rotate secret reference or revoke access",
        "operationId": "whmcsPintegrations__id_",
        "security": [
          {
            "SessionCookie": [],
            "CSRF": []
          }
        ],
        "x-go-route": "PUT /api/v1/integrations/{id}",
        "x-required-role": "admin",
        "description": "Administrator-only update. enabled must be explicitly present. Every update revokes all outstanding portal grants for this integration; installation protection, assets and mappings remain. Disabled integration rejects new signed requests. Secret values never pass through this API.",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "$ref": "#/components/schemas/ID"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "name": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 100
                  },
                  "secret_ref": {
                    "type": "string",
                    "pattern": "^BAREPULSE_[A-Z0-9_]{3,100}$"
                  },
                  "enabled": {
                    "type": "boolean"
                  }
                },
                "required": [
                  "name",
                  "secret_ref",
                  "enabled"
                ],
                "additionalProperties": false
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Updated integration; outstanding portal grants were revoked.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "id": {
                      "$ref": "#/components/schemas/ID"
                    },
                    "enabled": {
                      "type": "boolean"
                    }
                  },
                  "required": [
                    "id",
                    "enabled"
                  ],
                  "additionalProperties": false
                }
              }
            }
          },
          "400": {
            "description": "Name, secret reference or explicit enabled value invalid.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Integration not found.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
